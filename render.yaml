# Render blueprint: one Docker web service for the API. The web app deploys to Vercel from apps/web.
# Set NEBIUS_API_KEY and TAVILY_API_KEY in the Render dashboard (never in this file).
services:
  - type: web
    name: antidote-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PYTHONIOENCODING
        value: utf-8
